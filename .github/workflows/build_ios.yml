name: iOS

on:
  push:
    paths:
      - ".gitmodules"
      - "yup"
      - "CMakeLists.txt"
      - "VERSION"
      - "**/workflows/build_ios.yml"
      - "cmake/**"
      - "**/source/**"
      - "**/tests/**"
      - "**/benchmarks/**"
      - "**/data/**"
      - "**/packaging/**"
    branches:
      - "**"
  # Pull requests from forks get no push build, so they are built here.
  pull_request:
    paths:
      - ".gitmodules"
      - "yup"
      - "CMakeLists.txt"
      - "VERSION"
      - "**/workflows/build_ios.yml"
      - "cmake/**"
      - "**/source/**"
      - "**/tests/**"
      - "**/benchmarks/**"
      - "**/data/**"
      - "**/packaging/**"
  workflow_call:

concurrency:
  group: build_ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IOS_PLATFORM: OS64
  IOS_TOOLCHAIN_PATH: yup/cmake/toolchains/ios.cmake

jobs:
  build:
    # Branches of this repository are already built by the push event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: 'true'

    - name: Read project name
      shell: bash
      run: echo "PROJECT_NAME=$(sed -n -E 's/^[[:space:]]*set[[:space:]]*\([[:space:]]*PROJECT_NAME[[:space:]]+"([^"]*)".*/\1/p' CMakeLists.txt | head -n1)" >> "$GITHUB_ENV"

    - name: Configure
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -DCMAKE_TOOLCHAIN_FILE=${{ env.IOS_TOOLCHAIN_PATH }} \
          -DPLATFORM=${{ env.IOS_PLATFORM }} -B ${{ runner.workspace }}/build

    - name: Build Debug
      run: cmake --build ${{ runner.workspace }}/build --config Debug --target ${{ env.PROJECT_NAME }}_all

    - name: Build Release
      run: cmake --build ${{ runner.workspace }}/build --config Release --target ${{ env.PROJECT_NAME }}_all

    - name: Package
      id: package
      run: |
        BUILD_DIR="${{ runner.workspace }}/build" bash packaging/ios/build_ipa.sh Release
        echo "ipa=$(basename "$(ls dist/*-ios.ipa | head -n1)")" >> "$GITHUB_OUTPUT"

    - name: Upload iOS app
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.package.outputs.ipa }}
        path: dist/*-ios.ipa
